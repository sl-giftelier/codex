<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ping Pong</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="layout">
      <header class="header">
        <h1>Ping Pong</h1>
        <p>Use <strong>W/S</strong>, <strong>Arrow Up/Down</strong>, or drag on the table to move your paddle. First to 10 wins!</p>
      </header>
      <div class="stage">
        <canvas id="game" width="800" height="500" aria-label="Ping pong game"></canvas>
        <div id="overlay" class="overlay" hidden>
          <div class="overlay-card" role="dialog" aria-modal="false" aria-live="polite">
            <p id="overlayMessage"></p>
            <button id="playButton" type="button">Start Match</button>
          </div>
        </div>
      </div>
      <section class="scoreboard" aria-live="polite">
        <div class="score">
          <span class="label">Player</span>
          <span id="playerScore">0</span>
        </div>
        <div class="score">
          <span class="label">AI</span>
          <span id="aiScore">0</span>
        </div>
      </section>
      <p id="status" class="status" role="status" aria-live="polite">Press Start to begin.</p>
      <footer class="footer">
        <button id="restart" type="button">Restart Match</button>
      </footer>
    </main>
    <script src="pingpong.js" type="module"></script>
  </body>
</html>
